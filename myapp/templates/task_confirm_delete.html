{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Task - TaskMaster{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto;">
    <div class="card">
        <div class="card-header" style="border-bottom-color: var(--danger-color);">
            <h2 style="color: var(--danger-color); margin: 0;">⚠️ Delete Task</h2>
        </div>

        <div class="card-body" style="padding-top: 2rem;">
            <div class="alert alert-warning">
                <strong>Are you sure you want to delete this task?</strong>
                <p style="margin-top: 1rem; margin-bottom: 0;">This action cannot be undone.</p>
            </div>

            <div style="background-color: var(--light-bg); padding: 1.5rem; border-radius: var(--radius-md); margin: 2rem 0;">
                <p style="color: var(--text-light); font-size: 0.875rem; margin-bottom: 0.5rem;">Task Title</p>
                <p style="font-size: 1.25rem; font-weight: 700; margin: 0;">{{ task.title }}</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div style="display: flex; gap: 1rem; flex-direction: column;">
                    <button type="submit" class="btn btn-danger btn-block">🗑️ Yes, Delete Task</button>
                    <a href="{% url 'task_detail' task.pk %}" class="btn btn-secondary btn-block">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
