services:
  - type: web
    name: taskmaster
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && python manage.py collectstatic --noinput && python manage.py check
    startCommand: gunicorn mysite.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --worker-class sync --timeout 60
    healthCheckPath: /
    healthCheckStartupTimeout: 300
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.9.18

databases:
  - name: taskmaster-db
    databaseName: taskmaster
    plan: free
    region: oregon
