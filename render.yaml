services:
  - type: web
    name: taskmaster
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn mysite.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.7

databases:
  - name: taskmaster-db
    databaseName: taskmaster
    plan: free
    region: oregon
